spring.application.name=api_project
server.port=8080
#server.port=5500

spring.datasource.url=jdbc:mysql://localhost:3306/grocery_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

jwt.secret=Y2hhbmdlLXRoaXMtc2VjcmV0LWtleS1mb3ItZ3JvY2VyeS1hcGktand0LXNpZ25pbmctMjU2Yml0
jwt.expiration-ms=86400000



logging.level.root=INFO
logging.level.com.grocery.api=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/grocery-api.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30



spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

